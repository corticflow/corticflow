<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorticFlow // 3D Lab — Experimento Visual</title>
    <meta name="description" content="Laboratório de experimentação visual 3D e computação gráfica do portal CorticFlow.">
    
    <!-- Favicon Oficial -->
    <link rel="icon" type="image/png" href="https://github.com/corticflow.png">
    <link rel="apple-touch-icon" href="https://github.com/corticflow.png">

    <!-- CDN Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-dark: #0B0F19;
            --accent-cyan: #00E5FF;
            --accent-purple: #8B5CF6;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            user-select: none;
        }

        /* Menu Superior */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            background: linear-gradient(to bottom, rgba(11, 15, 25, 0.95) 0%, transparent 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--accent-cyan);
        }

        .brand-title {
            font-size: 17px;
            font-weight: 800;
            color: #FFF;
        }

        .brand-title span {
            color: var(--accent-cyan);
            font-family: monospace;
            font-weight: 400;
            margin-left: 6px;
            font-size: 13px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(19, 27, 46, 0.75);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--accent-cyan);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: var(--accent-cyan);
            color: #0B0F19;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            transform: translateX(-2px);
        }

        /* Canvas 3D */
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Controles Flutuantes no Rodapé */
        .hud-controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 50;
            background: rgba(19, 27, 46, 0.85);
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hud-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #FFF;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hud-btn:hover, .hud-btn.active {
            background: rgba(0, 229, 255, 0.2);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .hud-info {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 50;
            font-family: monospace;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            pointer-events: none;
        }

        .hud-info span { color: var(--accent-cyan); }

        .hint {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 50;
            pointer-events: none;
            opacity: 0.7;
            font-family: monospace;
        }

        @media (max-width: 640px) {
            .hud-controls { bottom: 16px; width: 90%; justify-content: center; }
            .hud-info { display: none; }
        }
    </style>
</head>
<body>

    <!-- Menu Superior -->
    <header>
        <div class="brand-area">
            <img src="https://github.com/corticflow.png" alt="CorticFlow" class="brand-logo">
            <div class="brand-title">CorticFlow <span>// 3D LAB</span></div>
        </div>
        <a href="index.html" class="back-link">← Voltar ao Portal</a>
    </header>

    <div class="hint">Arraste para rotacionar • Role para zoom</div>

    <!-- Canvas 3D -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Telemetria -->
    <div class="hud-info">
        ESTADO: <span>RENDER_ATIVO</span><br>
        GEOMETRIA: <span id="geo-name">NÚCLEO_QUÂNTICO</span><br>
        SHADERS: <span>NEON_CYAN_PURPLE</span>
    </div>

    <!-- Controles -->
    <div class="hud-controls">
        <button class="hud-btn active" onclick="changeShape(0, this)">Núcleo Quântico</button>
        <button class="hud-btn" onclick="changeShape(1, this)">Esfera Neural</button>
        <button class="hud-btn" onclick="changeShape(2, this)">Icosaedro</button>
        <button class="hud-btn" id="wire-btn" onclick="toggleWireframe(this)">Wireframe: ON</button>
    </div>

    <!-- Lógica Three.js -->
    <script>
        let scene, camera, renderer, currentMesh, particleSystem;
        let isWireframe = true;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const canvas = document.getElementById('webgl-canvas');

        const shapes = [
            { name: "NÚCLEO_QUÂNTICO", geom: () => new THREE.TorusKnotGeometry(1.6, 0.45, 128, 32, 2, 3) },
            { name: "ESFERA_NEURAL", geom: () => new THREE.SphereGeometry(2, 32, 32) },
            { name: "ICOSAEDRO", geom: () => new THREE.IcosahedronGeometry(2.2, 2) }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0B0F19, 0.04);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 6;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLightCyan = new THREE.PointLight(0x00E5FF, 3, 50);
            pointLightCyan.position.set(5, 5, 5);
            scene.add(pointLightCyan);

            const pointLightPurple = new THREE.PointLight(0x8B5CF6, 3, 50);
            pointLightPurple.position.set(-5, -5, 5);
            scene.add(pointLightPurple);

            createCentralMesh(shapes[0].geom());
            createParticles();

            window.addEventListener('resize', onWindowResize);
            setupInteraction();
            animate();
        }

        function createCentralMesh(geometry) {
            if (currentMesh) scene.remove(currentMesh);

            const material = new THREE.MeshStandardMaterial({
                color: 0x00E5FF,
                emissive: 0x8B5CF6,
                emissiveIntensity: 0.35,
                roughness: 0.2,
                metalness: 0.8,
                wireframe: isWireframe
            });

            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }

        function createParticles() {
            const particleCount = 1200;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 35;
                positions[i + 1] = (Math.random() - 0.5) * 35;
                positions[i + 2] = (Math.random() - 0.5) * 35;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const particleMat = new THREE.PointsMaterial({
                color: 0x00E5FF,
                size: 0.05,
                transparent: true,
                opacity: 0.6
            });

            particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);
        }

        function changeShape(index, btn) {
            createCentralMesh(shapes[index].geom());
            document.getElementById('geo-name').innerText = shapes[index].name;

            document.querySelectorAll('.hud-btn').forEach(b => {
                if (b !== document.getElementById('wire-btn')) b.classList.remove('active');
            });
            btn.classList.add('active');
        }

        function toggleWireframe(btn) {
            isWireframe = !isWireframe;
            if (currentMesh) currentMesh.material.wireframe = isWireframe;
            btn.innerText = `Wireframe: ${isWireframe ? 'ON' : 'OFF'}`;
            btn.classList.toggle('active', isWireframe);
        }

        function setupInteraction() {
            window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('mousemove', (e) => {
                if (isDragging && currentMesh) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    currentMesh.rotation.y += deltaX * 0.006;
                    currentMesh.rotation.x += deltaY * 0.006;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });
            window.addEventListener('touchend', () => { isDragging = false; });
            window.addEventListener('touchmove', (e) => {
                if (isDragging && currentMesh && e.touches.length === 1) {
                    const deltaX = e.touches[0].clientX - previousMousePosition.x;
                    const deltaY = e.touches[0].clientY - previousMousePosition.y;
                    currentMesh.rotation.y += deltaX * 0.006;
                    currentMesh.rotation.x += deltaY * 0.006;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });

            window.addEventListener('wheel', (e) => {
                camera.position.z += e.deltaY * 0.003;
                camera.position.z = Math.min(Math.max(camera.position.z, 3), 12);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (currentMesh && !isDragging) {
                currentMesh.rotation.x += 0.003;
                currentMesh.rotation.y += 0.005;
            }

            if (particleSystem) {
                particleSystem.rotation.y -= 0.0008;
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
