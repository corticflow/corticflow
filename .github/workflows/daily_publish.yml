name: Daily Publish

on:
  schedule:
    - cron: "0 6 * * *" # Executa todo dia às 06:00 UTC
  workflow_dispatch: # Botão para executar manualmente quando quiser

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt || pip install feedparser google-generativeai requests

      - name: Run automation script
        run: python automate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posts.json
          git commit -m "chore: publicacao automatica de artigos [skip ci]" || echo "Sem alteracoes para commitar"
          git push origin main
