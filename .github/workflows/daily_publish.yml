name: Publicacao Diaria Autonoma CorticFlow

on:
  schedule:
    - cron: '0 9 * * *' # Executa diariamente às 06:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install requests feedparser

      - name: Executar Gerador de Artigos CorticFlow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python automate.py

      - name: Salvar e Publicar no Repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(content): publicacao automatica de artigos [skip ci]"
          branch: main
          file_pattern: "content/** posts.json"
