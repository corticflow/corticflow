name: Daily Content Publish

on:
  schedule:
    # De hora em hora, das 6h às 22h no horário de Brasília (09h às 01h UTC)
    - cron: '0 9-23,0-1 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-generativeai requests

      - name: Run Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automate.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posts.json covers/
          git diff --staged --quiet || git commit -m "chore: publicacao automatica de materias e capas"
          git push origin main || echo "Sem alteracoes para enviar"
