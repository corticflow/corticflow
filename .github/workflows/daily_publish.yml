name: Publicacao Diaria Autonoma CorticFlow

on:
  schedule:
    - cron: '0 9 * * *' # Executa diariamente às 06:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install requests feedparser

      - name: Executar Gerador de Artigos CorticFlow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python automate.py

      - name: Fazer Commit e Publicar no Site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(content): atualizacao diaria de artigos [skip ci]" || echo "Sem alteracoes para commitar"
          git push origin main
