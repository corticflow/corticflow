    <style>
        :root {
            --bg-dark: #0B0F19;
            --card-bg: #131B2E;
            --border-color: #232F48;
            --accent-cyan: #00E5FF;
            --accent-purple: #8B5CF6;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }

        /* Header */
        header { background: rgba(11, 15, 25, 0.95); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 42px; border-radius: 8px; object-fit: contain; }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

        /* Hero Banner */
        .hero-section { position: relative; border-radius: 16px; overflow: hidden; margin-bottom: 40px; border: 1px solid var(--border-color); }
        .hero-img { width: 100%; height: 360px; object-fit: cover; display: block; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(11, 15, 25, 0.95) 10%, rgba(11, 15, 25, 0.4) 60%, transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 35px; }
        .hero-title { font-size: 32px; font-weight: 800; color: #FFF; margin-bottom: 10px; }
        .hero-subtitle { color: #CBD5E1; font-size: 16px; max-width: 700px; }

        /* Grid de Categorias */
        .section-title { font-size: 22px; font-weight: 800; color: #FFF; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ""; display: inline-block; width: 4px; height: 22px; background: var(--accent-cyan); border-radius: 2px; }

        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .cat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
        .cat-card:hover { transform: translateY(-4px); border-color: var(--accent-cyan); }
        .cat-img { width: 100%; height: 140px; object-fit: cover; }
        .cat-info { padding: 16px; }
        .cat-name { font-weight: 700; font-size: 16px; color: #FFF; }
        .cat-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        /* Grid de Artigos */
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; margin-bottom: 50px; }
        .article-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
        .article-card:hover { transform: translateY(-5px); border-color: var(--accent-cyan); box-shadow: 0 10px 25px rgba(0, 229, 255, 0.15); }
        
        .article-cover { width: 100%; height: 190px; object-fit: cover; background: #1E293B; }
        .article-body { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
        .article-badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; }
        .badge { background: rgba(0, 229, 255, 0.15); color: var(--accent-cyan); border: 1px solid rgba(0, 229, 255, 0.3); font-weight: 700; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; }
        .badge-purple { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); border-color: rgba(139, 92, 246, 0.3); }
