<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorticFlow | Inteligência &amp; Benchmark em IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=Fira+Code&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyan: { DEFAULT: '#00E5FF' },
                        violet: { DEFAULT: '#8B5CF6' },
                        dark: { slate: '#0B0F19', card: '#111827', inner: '#131B2E' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0F19; }
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 8px; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-[#0B0F19] text-slate-100 min-h-screen flex flex-col antialiased relative selection:bg-cyan selection:text-slate-950" x-data="corticFlow()" x-init="init()" x-cloak>
    <canvas id="neural-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <!-- Header / Navbar -->
    <header class="glass sticky top-0 z-40 border-b border-white/10 px-6 py-4 relative">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-9 h-9 bg-gradient-to-tr from-cyan to-violet rounded-xl flex items-center justify-center text-slate-900 font-bold text-lg shadow-lg shadow-cyan/20 group-hover:scale-105 transition-transform">C</div>
                <span class="text-2xl font-bold tracking-tighter font-display text-white">Cortic<span class="text-cyan">Flow</span></span>
            </a>
            
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-400">
                <a href="#benchmark" class="hover:text-cyan transition-colors" x-text="t[currentLang].navBenchmark"></a>
                <a href="#artigos" class="hover:text-cyan transition-colors" x-text="t[currentLang].navArticles"></a>
                <a href="terms.html" class="hover:text-cyan transition-colors" x-text="t[currentLang].navTerms"></a>
                <a href="privacy.html" class="hover:text-cyan transition-colors" x-text="t[currentLang].navPrivacy"></a>
            </nav>

            <div class="flex items-center gap-4">
                <!-- Seletor de Idioma Bilíngue -->
                <div class="flex items-center bg-white/5 border border-white/10 rounded-full p-1 shadow-inner">
                    <button 
                        @click="setLanguage('pt')" 
                        :class="currentLang === 'pt' ? 'bg-cyan text-slate-950 font-extrabold shadow-sm' : 'text-slate-400 hover:text-white'" 
                        class="px-3 py-1 text-xs rounded-full transition-all">PT</button>
                    <button 
                        @click="setLanguage('en')" 
                        :class="currentLang === 'en' ? 'bg-cyan text-slate-950 font-extrabold shadow-sm' : 'text-slate-400 hover:text-white'" 
                        class="px-3 py-1 text-xs rounded-full transition-all">EN</button>
                </div>

                <a href="#newsletter" class="hidden sm:inline-block bg-cyan text-slate-950 font-bold text-xs px-4 py-2 rounded-full hover:bg-white transition-all shadow-md shadow-cyan/20" x-text="t[currentLang].navNewsletter"></a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="pt-16 pb-8 px-6 max-w-7xl mx-auto w-full relative z-10">
        <div class="text-center max-w-3xl mx-auto mb-10">
            <span class="inline-block px-3 py-1 mb-4 text-[11px] font-bold tracking-widest text-cyan uppercase bg-cyan/10 border border-cyan/20 rounded-full" x-text="t[currentLang].badgeHero"></span>
            <h1 class="text-4xl md:text-6xl font-extrabold font-display text-white mb-4 tracking-tight leading-tight">
                <span x-text="t[currentLang].heroTitle1"></span> <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan to-violet" x-text="t[currentLang].heroTitle2"></span>
            </h1>
            <p class="text-slate-400 text-base md:text-lg leading-relaxed" x-text="t[currentLang].heroDesc"></p>
        </div>
    </section>

    <!-- Seção de Benchmark da Semana (Leaderboard & Gráfico) -->
    <section id="benchmark" class="max-w-7xl mx-auto px-6 pb-16 w-full relative z-10">
        <div class="glass rounded-3xl p-6 md:p-10 border border-cyan/30 relative overflow-hidden shadow-2xl">
            <div class="absolute -top-32 -right-32 w-80 h-80 bg-violet/15 blur-[120px] rounded-full pointer-events-none"></div>

            <!-- Cabeçalho do Benchmark -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b border-white/10 pb-6">
                <div>
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-cyan animate-ping"></span>
                        <span class="text-xs font-mono font-bold tracking-widest text-cyan uppercase" x-text="t[currentLang].benchmarkBadge"></span>
                    </div>
                    <h2 class="text-2xl md:text-3xl font-bold font-display text-white" x-text="t[currentLang].benchmarkTitle"></h2>
                    <p class="text-slate-400 text-xs md:text-sm mt-1" x-text="t[currentLang].benchmarkSubtitle"></p>
                </div>
                <div class="text-xs font-mono text-slate-400 bg-white/5 px-4 py-2 rounded-xl border border-white/10">
                    <span x-text="t[currentLang].benchmarkUpdated"></span>: <strong class="text-white" x-text="t[currentLang].benchmarkWeekDate"></strong>
                </div>
            </div>

            <!-- Card Destaque: #1 Modelo da Semana -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-center mb-10 bg-gradient-to-br from-[#131B2E] to-[#111827] p-6 md:p-8 rounded-2xl border border-cyan/25 shadow-lg">
                <div class="lg:col-span-1">
                    <span class="inline-block px-3 py-1 text-[10px] font-bold uppercase tracking-widest bg-cyan/15 text-cyan border border-cyan/30 rounded-md mb-3" x-text="t[currentLang].topModelBadge"></span>
                    <h3 class="text-2xl md:text-3xl font-extrabold text-white mb-2" x-text="benchmarks[0].name"></h3>
                    <p class="text-xs text-slate-400 mb-4" x-text="t[currentLang].topModelDeveloper + ': ' + benchmarks[0].developer"></p>
                    <div class="text-4xl font-black font-display text-transparent bg-clip-text bg-gradient-to-r from-cyan to-violet mb-6">
                        <span x-text="benchmarks[0].score"></span><span class="text-base text-slate-400 font-normal"> / 100</span>
                    </div>
                    <a 
                        :href="benchmarks[0].url" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        class="inline-flex items-center gap-2 bg-cyan text-slate-950 font-extrabold text-xs px-5 py-3 rounded-xl hover:bg-white transition-all shadow-lg shadow-cyan/20">
                        <span x-text="t[currentLang].accessAiBtn + ' (' + benchmarks[0].developer + ')'"></span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                    </a>
                </div>

                <!-- Gráfico de Barras de Performance -->
                <div class="lg:col-span-2 space-y-4">
                    <div>
                        <div class="flex justify-between text-xs font-mono mb-1.5">
                            <span class="text-slate-300" x-text="t[currentLang].metricReasoning"></span>
                            <span class="text-cyan font-bold" x-text="benchmarks[0].reasoning + '%'"></span>
                        </div>
                        <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                            <div class="h-full bg-gradient-to-r from-cyan to-violet rounded-full transition-all duration-1000" :style="'width: ' + benchmarks[0].reasoning + '%'"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-mono mb-1.5">
                            <span class="text-slate-300" x-text="t[currentLang].metricCoding"></span>
                            <span class="text-cyan font-bold" x-text="benchmarks[0].coding + '%'"></span>
                        </div>
                        <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                            <div class="h-full bg-gradient-to-r from-cyan to-violet rounded-full transition-all duration-1000" :style="'width: ' + benchmarks[0].coding + '%'"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-mono mb-1.5">
                            <span class="text-slate-300" x-text="t[currentLang].metricMath"></span>
                            <span class="text-cyan font-bold" x-text="benchmarks[0].math + '%'"></span>
                        </div>
                        <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                            <div class="h-full bg-gradient-to-r from-cyan to-violet rounded-full transition-all duration-1000" :style="'width: ' + benchmarks[0].math + '%'"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-mono mb-1.5">
                            <span class="text-slate-300" x-text="t[currentLang].metricEfficiency"></span>
                            <span class="text-cyan font-bold" x-text="benchmarks[0].efficiency + '%'"></span>
                        </div>
                        <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                            <div class="h-full bg-gradient-to-r from-cyan to-violet rounded-full transition-all duration-1000" :style="'width: ' + benchmarks[0].efficiency + '%'"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabela Comparativa de IAs com Links Diretos de Uso -->
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="border-b border-white/10 text-slate-400 font-mono uppercase text-[10px]">
                            <th class="py-3 px-4" x-text="t[currentLang].thRank"></th>
                            <th class="py-3 px-4" x-text="t[currentLang].thModel"></th>
                            <th class="py-3 px-4 text-center" x-text="t[currentLang].thOverallScore"></th>
                            <th class="py-3 px-4 text-center" x-text="t[currentLang].thReasoning"></th>
                            <th class="py-3 px-4 text-center" x-text="t[currentLang].thCoding"></th>
                            <th class="py-3 px-4 text-center" x-text="t[currentLang].thEfficiency"></th>
                            <th class="py-3 px-4 text-right" x-text="t[currentLang].thAccess"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-white/5 font-mono">
                        <template x-for="item in benchmarks" :key="item.rank">
                            <tr class="hover:bg-white/5 transition-colors">
                                <td class="py-4 px-4 font-bold text-white">
                                    <span class="w-6 h-6 rounded-full inline-flex items-center justify-center text-slate-950 font-extrabold text-[11px]"
                                          :class="item.rank === 1 ? 'bg-cyan' : (item.rank === 2 ? 'bg-slate-300' : 'bg-amber-600/80 text-white')"
                                          x-text="'#' + item.rank"></span>
                                </td>
                                <td class="py-4 px-4 font-sans font-medium text-white">
                                    <div class="font-bold text-sm" x-text="item.name"></div>
                                    <div class="text-[11px] text-slate-400 font-mono" x-text="item.developer"></div>
                                </td>
                                <td class="py-4 px-4 text-center text-cyan font-bold text-sm" x-text="item.score"></td>
                                <td class="py-4 px-4 text-center text-slate-300" x-text="item.reasoning + '%'"></td>
                                <td class="py-4 px-4 text-center text-slate-300" x-text="item.coding + '%'"></td>
                                <td class="py-4 px-4 text-center text-slate-300" x-text="item.efficiency + '%'"></td>
                                <td class="py-4 px-4 text-right font-sans">
                                    <a 
                                        :href="item.url" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        class="inline-flex items-center gap-1.5 bg-white/10 hover:bg-cyan hover:text-slate-950 text-white font-bold text-xs px-3.5 py-1.5 rounded-lg transition-all">
                                        <span x-text="t[currentLang].useAiAction"></span>
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                        </svg>
                                    </a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Seção de Artigos & Análises (Cards Interativos) -->
    <main class="max-w-7xl mx-auto px-6 pb-20 flex-grow w-full relative z-10" id="artigos">
        <div class="mb-8 border-b border-white/10 pb-4">
            <h2 class="text-2xl font-bold font-display text-white" x-text="t[currentLang].articlesSectionTitle"></h2>
            <p class="text-slate-400 text-xs md:text-sm mt-1" x-text="t[currentLang].articlesSectionDesc"></p>
        </div>

        <!-- Loading State -->
        <div x-show="isLoading" class="flex flex-col items-center justify-center py-20">
            <div class="w-10 h-10 border-4 border-cyan border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-400 text-sm font-mono" x-text="t[currentLang].loadingText"></p>
        </div>

        <!-- Articles Grid (Cards Interativos com Gradiente e Efeito Cyber) -->
        <div x-show="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <template x-for="item in articles" :key="item.id">
                <article 
                    class="relative rounded-2xl overflow-hidden border border-white/10 hover:border-cyan/50 transition-all duration-300 flex flex-col cursor-pointer group transform hover:-translate-y-1.5 hover:shadow-[0_12px_35px_rgba(0,229,255,0.15)] bg-gradient-to-b from-[#131B2E]/90 to-[#0B0F19]/95 backdrop-blur-xl"
                    @click="openModal(item)">
                    <div class="aspect-video w-full overflow-hidden bg-slate-900 relative">
                        <img 
                            :src="item.image" 
                            :alt="getArticleTitle(item)"
                            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1600&h=900&fit=crop';">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0B0F19] via-transparent to-transparent opacity-60"></div>
                        <div class="absolute top-3 left-3">
                            <span class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-widest bg-slate-950/85 text-cyan rounded-md border border-cyan/30 backdrop-blur-md shadow-md" x-text="item.source"></span>
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="text-[11px] text-slate-500 font-mono mb-2" x-text="item.date"></div>
                            <h3 class="text-lg font-bold text-white group-hover:text-cyan transition-colors mb-3 leading-snug" x-text="getArticleTitle(item)"></h3>
                            <p class="text-slate-400 text-xs line-clamp-3 leading-relaxed mb-4" x-text="getArticleExcerpt(item)"></p>
                        </div>
                        <div class="pt-4 border-t border-white/5 flex items-center justify-between text-xs font-semibold text-cyan">
                            <span x-text="t[currentLang].readMore"></span>
                            <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </div>
                </article>
            </template>
        </div>
    </main>

    <!-- Modal de Leitura Long-Form -->
    <div 
        x-show="isModalOpen" 
        class="fixed inset-0 z-50 overflow-y-auto bg-black/85 backdrop-blur-md flex items-center justify-center p-4"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0">
        
        <div 
            class="bg-[#111827] border border-white/15 rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar p-6 md:p-10 relative shadow-2xl"
            @click.outside="closeModal()">
            
            <button 
                @click="closeModal()" 
                class="absolute top-6 right-6 text-slate-400 hover:text-white bg-white/5 hover:bg-white/10 w-9 h-9 rounded-full flex items-center justify-center transition-all">
                ✕
            </button>

            <template x-if="activeDoc">
                <div>
                    <div class="flex items-center gap-3 mb-4">
                        <span class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-widest bg-cyan/10 text-cyan border border-cyan/30 rounded" x-text="activeDoc.source"></span>
                        <span class="text-xs text-slate-500 font-mono" x-text="activeDoc.date"></span>
                    </div>

                    <h2 class="text-2xl md:text-4xl font-extrabold font-display text-white mb-6 leading-tight" x-text="getArticleTitle(activeDoc)"></h2>

                    <div class="aspect-video w-full rounded-2xl overflow-hidden mb-8 border border-white/10 relative shadow-xl">
                        <img :src="activeDoc.image" :alt="getArticleTitle(activeDoc)" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#111827] via-transparent to-transparent opacity-40"></div>
                    </div>

                    <!-- Box Destaque Executivo -->
                    <div class="bg-[#131B2E] border-l-4 border-cyan p-4 rounded-r-xl mb-6 text-xs md:text-sm text-slate-300 leading-relaxed font-sans shadow-inner">
                        <strong class="text-cyan block mb-1 font-mono uppercase tracking-wider" x-text="currentLang === 'pt' ? 'Síntese Editorial' : 'Editorial Brief'"></strong>
                        <span x-text="getArticleExcerpt(activeDoc)"></span>
                    </div>

                    <!-- Conteúdo Long-Form Completo -->
                    <div class="text-slate-300 text-sm md:text-base leading-relaxed space-y-4 whitespace-pre-line font-sans" x-text="getArticleContent(activeDoc)"></div>

                    <div class="mt-8 pt-6 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <a 
                            :href="activeDoc.link" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="text-xs text-cyan hover:underline flex items-center gap-1.5 font-mono">
                            <span x-text="t[currentLang].modalSource"></span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                        </a>
                        <button 
                            @click="closeModal()" 
                            class="bg-white/10 text-white hover:bg-white/20 px-5 py-2 rounded-xl text-xs font-bold transition-all"
                            x-text="t[currentLang].modalClose">
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Newsletter CTA Section -->
    <section id="newsletter" class="max-w-7xl mx-auto px-6 py-16 w-full relative z-10">
        <div class="glass rounded-3xl p-8 md:p-14 text-center relative overflow-hidden border border-cyan/20">
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-cyan/10 blur-[100px] rounded-full pointer-events-none"></div>
            <h2 class="text-2xl md:text-4xl font-extrabold font-display text-white mb-3" x-text="t[currentLang].newsletterTitle"></h2>
            <p class="text-slate-400 text-sm md:text-base max-w-lg mx-auto mb-8" x-text="t[currentLang].newsletterDesc"></p>
            <form class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto" @submit.prevent="alert(t[currentLang].newsletterSuccess)">
                <input 
                    type="email" 
                    :placeholder="t[currentLang].newsletterPlaceholder" 
                    required 
                    class="flex-1 bg-slate-900/90 border border-white/15 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-cyan transition-all">
                <button 
                    type="submit" 
                    class="bg-cyan text-slate-950 px-6 py-3 rounded-xl font-bold text-sm hover:bg-white transition-all shadow-lg shadow-cyan/20"
                    x-text="t[currentLang].newsletterBtn">
                </button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-white/10 bg-[#080B12] py-12 px-6 text-slate-400 text-xs relative z-10">
        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 mb-10">
            <div class="col-span-1 md:col-span-2">
                <span class="text-xl font-bold text-white font-display">Cortic<span class="text-cyan">Flow</span></span>
                <p class="mt-3 text-slate-500 max-w-sm leading-relaxed" x-text="t[currentLang].footerDesc"></p>
            </div>
            <div>
                <h4 class="text-white font-bold mb-4 uppercase tracking-widest text-[11px]" x-text="t[currentLang].footerCompliance"></h4>
                <ul class="space-y-2">
                    <li><a href="privacy.html" class="hover:text-cyan transition-colors" x-text="t[currentLang].navPrivacy"></a></li>
                    <li><a href="terms.html" class="hover:text-cyan transition-colors" x-text="t[currentLang].navTerms"></a></li>
                </ul>
            </div>
            <div>
                <h4 class="text-white font-bold mb-4 uppercase tracking-widest text-[11px]" x-text="t[currentLang].footerStatus"></h4>
                <div class="flex items-center gap-2 text-slate-300 font-mono text-[11px]">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span x-text="t[currentLang].pipelineActive"></span>
                </div>
            </div>
        </div>
        <div class="max-w-7xl mx-auto pt-6 border-t border-white/5 text-center text-slate-600 text-[11px]">
            © 2026 CorticFlow Media. <span x-text="t[currentLang].rights"></span>
        </div>
    </footer>

    <!-- Logic Layer (Alpine.js) -->
    <script>
    (function initNeuralCanvas() {
        const canvas = document.getElementById('neural-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        let mouse = { x: null, y: null, maxDist: 150 };
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        const particleCount = Math.min(Math.floor((window.innerWidth * window.innerHeight) / 18000), 65);
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.7,
                vy: (Math.random() - 0.5) * 0.7,
                radius: Math.random() * 1.8 + 1,
                color: Math.random() > 0.5 ? 'rgba(0, 229, 255, ' : 'rgba(139, 92, 246, '
            });
        }
        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - p.x, dy = mouse.y - p.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.maxDist) {
                        p.x -= (dx / dist) * 0.6;
                        p.y -= (dy / dist) * 0.6;
                    }
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color + '0.7)';
                ctx.fill();
                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x, dy = p.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 229, 255, ${(1 - dist / 130) * 0.25})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
